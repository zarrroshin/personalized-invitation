<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#034c59">
<title>دعوت‌نامه نمایشگاه مدیریت شهری</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100vh;background:#f3f0e8;display:flex;justify-content:center;align-items:flex-start}
.invitation{width:min(100vw,1024px);position:relative;overflow:hidden;line-height:1}
.poster{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}

/* The artwork already contains the gold ornamental name plate.
   The name is only text now—no extra teal pill is drawn over the plate. */
.guest-name{
  position:absolute;
  left:50%;
  top:27.78%;
  transform:translate(-50%,-50%);
  width:43%;
  min-height:3.8%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 1.5%;
  color:#fff;
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
  font-weight:700;
  font-size:clamp(22px,4.15vw,43px);
  line-height:1.15;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  direction:rtl;
  z-index:3;
  text-shadow:0 1px 1px rgba(0,0,0,.12);
}

/* Invisible links preserve the clickable areas of the artwork. */
.map-link{position:absolute;left:34.5%;top:67.5%;width:31%;height:5.1%;border-radius:999px;z-index:4}
.phone-link{position:absolute;left:5.5%;top:87%;width:23%;height:4.8%;z-index:4}

@media(max-width:600px){
  .guest-name{
    top:27.78%;
    width:43%;
    font-size:clamp(17px,5.15vw,31px);
  }
  .map-link{left:33%;width:34%}
  .phone-link{left:4%;width:29%}
}
@media print{body{background:#fff}.invitation{width:100%}}
</style>
</head>
<body>
<main class="invitation" aria-label="دعوت‌نامه نمایشگاه مدیریت شهری">
<img class="poster" src="assets/invitation-design.png" alt="دعوت‌نامه هفتمین نمایشگاه جامع مدیریت شهری، خدمات شهری، حمل‌ونقل و ترافیک شهری شیراز">
<div class="guest-name" id="guestName">نام مهمان</div>
<a class="map-link" href="https://www.google.com/maps/search/?api=1&query=نمایشگاه+بین+المللی+شیراز" target="_blank" rel="noopener" aria-label="مشاهده موقعیت غرفه"></a>
<a class="phone-link" href="tel:09131418828" aria-label="تماس با شرکت پرستوی جنوب شرق"></a>
</main>
<script>
const BAKED_NAME="";
const params=new URLSearchParams(location.search);
const name=(params.get("name")||BAKED_NAME).trim();
const nameEl=document.getElementById("guestName");
if(name){
  nameEl.textContent=name;
  document.title=`دعوت‌نامه ${name}`;
}

/* Automatically shrink unusually long names so they remain inside the plate. */
function fitName(){
  const max=window.innerWidth<=600 ? 31 : 43;
  let size=parseFloat(getComputedStyle(nameEl).fontSize);
  const min=window.innerWidth<=600 ? 14 : 18;
  while(nameEl.scrollWidth>nameEl.clientWidth && size>min){
    size-=1;
    nameEl.style.fontSize=size+"px";
  }
}
window.addEventListener("load",fitName);
window.addEventListener("resize",()=>{nameEl.style.fontSize="";fitName()});
</script>
</body>
</html>
